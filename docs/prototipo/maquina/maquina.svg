    <path d="M308 226 L324 233 M308 241 L324 233 M308 226 V241" class="rv2" fill="none"/>
    <circle cx="308" cy="226" r="3.2" fill="#fff" class="rv2"/><circle cx="308" cy="241" r="3.2" fill="#fff" class="rv2"/><circle cx="324" cy="233" r="3.2" fill="#fff" class="rv2"/>
