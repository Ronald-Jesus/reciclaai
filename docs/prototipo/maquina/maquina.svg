      <rect x="58" y="546" width="92" height="12" rx="3" fill="#9c3229" class="rv"/>
      <rect x="84" y="550" width="40" height="4" fill="#111"/>
      <g transform="translate(104 584)"><path d="M-3 -20 h6 v6 l6 6 v22 a3 3 0 0 1 -3 3 h-12 a3 3 0 0 1 -3 -3 v-22 l6 -6 z" fill="#fff" class="rv2"/></g>
    </g>
    <!-- metal -->
    <g id="bin-metal">
      <rect x="156" y="546" width="84" height="64" rx="4" fill="#c99700" class="rv"/>
      <rect x="152" y="546" width="92" height="12" rx="3" fill="#957000" class="rv"/>
      <rect x="178" y="550" width="40" height="4" fill="#111"/>
      <g transform="translate(198 584)"><rect x="-10" y="-14" width="20" height="30" rx="3" fill="#fff" class="rv2"/><path d="M-10 -8 h20 M-10 10 h20" class="rv2" fill="none"/></g>
    </g>
    <!-- vidro -->
