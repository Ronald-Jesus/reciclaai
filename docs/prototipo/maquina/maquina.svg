<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-label="Máquina de retorno de embalagens ReciclaAI, em corte, mostrando as nove peças internas" style="overflow:visible">
  <style>
    .rv { stroke: #111; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .rv2 { stroke: #111; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .rvn { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .tela-txt { font-family: "Archivo Black", "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; font-size: 15px; text-anchor: middle; fill: #111; }
  </style>

  <!-- Contorno: corpo da máquina vazia, tracejado -->
