<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montagem da máquina ReciclaAI (demo)</title>
<style>
  :root { --ink:#111; --paper:#fff1c9; --bg:#f6e7b4; --pink:#ff6fb5; --lime:#b6e03c; --blue:#2f6db5; }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin:0; color:var(--ink); background:var(--bg);
    font-family: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif; line-height:1.4; }
  h1,h2,.contador { font-family: "Archivo Black", "Arial Black", Impact, system-ui, sans-serif; font-weight:900; margin:0; }
  .intro, .fim { min-height:60vh; display:grid; place-content:center; padding:2rem 1rem; text-align:center; }
  .intro h1 { font-size:clamp(2rem,7vw,4.5rem); line-height:1; }
  .intro p, .fim p { max-width:34ch; margin:1rem auto 0; font-size:1.1rem; }
  .palco { height:100vh; height:100svh; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:2rem; align-items:center; padding:1.5rem 2rem; overflow:hidden; }
  .maquina { height:100%; display:flex; justify-content:center; align-items:center; min-height:0; }
  .maquina svg { height:100%; max-height:92svh; width:auto; max-width:100%; overflow:visible; }
  .painel { border:3px solid var(--ink); background:#fff; box-shadow:8px 8px 0 var(--ink); padding:1.25rem; max-width:30rem; }
  .contador { font-size:clamp(1.4rem,3vw,2.2rem); }
  .barra { height:18px; border:3px solid var(--ink); background:#fff; margin:.75rem 0 1rem; }
  .barra > i { display:block; height:100%; width:0; background:var(--pink); border-right:3px solid var(--ink); transition:width .25s; }
  .painel h2 { font-size:1.4rem; margin-bottom:.4rem; }
  .painel p { margin:0; font-size:1.05rem; }
  .lista { max-width:40rem; margin:1rem auto 3rem; padding:0 1rem; list-style:none; counter-reset:p; }
  .lista li { counter-increment:p; border:3px solid var(--ink); background:#fff; box-shadow:5px 5px 0 var(--ink); padding:.75rem 1rem .75rem 3.2rem; margin-bottom:1rem; position:relative; }
  .lista li::before { content:counter(p); position:absolute; left:.7rem; top:.6rem; width:1.8rem; height:1.8rem; border:3px solid var(--ink); background:var(--lime); text-align:center; font-weight:900; line-height:1.5rem; }
  .lista strong { display:block; }
  .lista[hidden] { display:none; }
  .reduzido .palco { height:auto; padding:2rem 1rem 0; grid-template-columns:1fr; }
  .reduzido .maquina { height:auto; }
  .reduzido .maquina svg { height:70svh; }
  .reduzido .painel { display:none; }
  @media (max-width:700px) {
    .palco { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; gap:.75rem; padding:.75rem 1rem; align-items:stretch; }
    .maquina svg { max-height:100%; }
    .painel { max-width:none; padding:.75rem; box-shadow:5px 5px 0 var(--ink); }
    .painel h2 { font-size:1.1rem; }
    .painel p { font-size:.95rem; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(function () {
  var PECAS = [
    ["Compartimentos (PET, lata, vidro)", "Separar já na máquina deixa o material mais valioso para o reciclador."],
    ["Separador", "Desvia cada embalagem para o compartimento certo depois da decisão da IA."],
    ["Compactador", "Amassa PET e lata: cabe muito mais até o próximo esvaziamento. Vidro segue inteiro."],
    ["Balança", "Confere o peso: garrafa ainda cheia é devolvida."],
    ["Esteira", "Gira a embalagem na frente da câmera e do leitor."],
    ["Leitor de código de barras", "Nas máquinas alemãs, confirma que a embalagem faz parte do sistema; aqui reforça a decisão da IA."],
    ["Câmera e IA", "O coração da máquina: identifica o material. É a IA que o visitante testa na subpágina."],
    ["Abertura de entrada", "Recebe um item por vez, com luz indicando quando está pronta."],
    ["Tela e impressora de voucher", "Mostra o resultado e entrega o crédito."]
  ];
  var N = PECAS.length;
  var svg = document.querySelector("#maquina svg");
  var pecas = svg.querySelectorAll("[data-peca]");
  var telaOn = svg.querySelector("#tela-ligada"), telaOff = svg.querySelector("#tela-desligada");
  var luz = svg.querySelector("#luz-estado");
  var $c = document.getElementById("contador"), $n = document.getElementById("nome"),
      $p = document.getElementById("porque"), $b = document.getElementById("barra");

  function ligarTela(on) {
    telaOn.setAttribute("display", on ? "inline" : "none");
    telaOff.setAttribute("display", on ? "none" : "inline");
    luz.setAttribute("fill", on ? "#7ddc3c" : "#ff8a00");
  }

  var reduzir = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var semLib = !(window.gsap && window.ScrollTrigger);

  if (reduzir || semLib) {
    document.body.classList.add("reduzido");
    ligarTela(true);
    var ol = document.getElementById("lista");
    PECAS.forEach(function (p) {
      var li = document.createElement("li");
      li.innerHTML = "<strong></strong><span></span>";
      li.firstChild.textContent = p[0];
      li.lastChild.textContent = p[1];
      ol.appendChild(li);
    });
    ol.hidden = false;
    return;
  }

  gsap.registerPlugin(ScrollTrigger);
  var lenis = new Lenis();
  lenis.on("scroll", ScrollTrigger.update);
  gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
  gsap.ticker.lagSmoothing(0);

  ligarTela(false);
  gsap.set(luz, { transformOrigin: "50% 50%" });
  var pulso = gsap.to(luz, { scale: 1.2, duration: 0.5, yoyo: true, repeat: -1, ease: "sine.inOut", paused: true });

  // cada peça chega de um lado diferente, girada, e encaixa com leve "pulo"
  var origens = [{ y: 340 }, { x: -300 }, { x: 300 }];
  var tl = gsap.timeline({ paused: true });
  pecas.forEach(function (el, i) {
    var o = origens[i % 3];
    var rot = (i % 2 ? 1 : -1) * 9;
    gsap.set(el, { opacity: 0, x: o.x || 0, y: o.y || 0, rotation: rot, transformOrigin: "50% 50%" });
    tl.to(el, { opacity: 1, x: 0, y: 0, rotation: 0, duration: 0.85, ease: "back.out(1.6)" }, i);
  });
  tl.to({}, { duration: 1 }, N); // trecho final: tela liga

  var atual = -1, ligada = false;
  function atualizar(tempo) {
    var n = Math.max(0, Math.min(N, Math.floor(tempo - 0.4) + 1));
    if (n !== atual) {
      atual = n;
      $c.textContent = n + " de " + N + " peças";
      $b.setAttribute("aria-valuenow", n);
      $b.firstElementChild.style.width = (n / N * 100) + "%";
      if (n === 0) { $n.textContent = "Máquina vazia"; $p.textContent = "Só o contorno. Role para começar."; }
      else { $n.textContent = PECAS[n - 1][0]; $p.textContent = PECAS[n - 1][1]; }
      if (n >= 8) pulso.play(); else { pulso.pause(); gsap.set(luz, { scale: 1 }); }
    }
    var on = tempo >= N + 0.3;
    if (on !== ligada) {
      ligada = on;
      ligarTela(on);
      if (on) {
        gsap.fromTo(telaOn, { opacity: 0 }, { opacity: 1, duration: 0.3, repeat: 1, yoyo: true, repeatDelay: 0, onComplete: function () { gsap.set(telaOn, { opacity: 1 }); } });
        $n.textContent = "Máquina ligada";
        $p.textContent = "A tela mostra “Insira uma embalagem”.";
      }
    }
  }

  var mobile = function () { return window.innerWidth < 600; };
  ScrollTrigger.create({
    trigger: "#palco",
    start: "top top",
    end: function () { return "+=" + ((N + 1) * (mobile() ? 200 : 380)); },
    pin: true,
    scrub: 0.5,
    invalidateOnRefresh: true,
    animation: tl,
    onUpdate: function () { atualizar(tl.time()); }
  });
  atualizar(0);
})();
</script>
